<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Countdown to Oct 23</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: radial-gradient(circle at 30% 20%, #1e4620 0%, #0f2a12 45%, #081a09 100%);
    color: #eafbe6;
    overflow: hidden;
    position: relative;
  }

  /* drifting "chains" sparkle background */
  .bg-disc {
    position: absolute;
    border-radius: 50%;
    opacity: 0.08;
    background: #7de37e;
    filter: blur(1px);
    animation: float 18s linear infinite;
  }
  @keyframes float {
    0% { transform: translateY(110vh) rotate(0deg); }
    100% { transform: translateY(-20vh) rotate(360deg); }
  }

  .card {
    position: relative;
    z-index: 2;
    text-align: center;
    padding: 48px 36px;
    background: rgba(10, 30, 12, 0.55);
    border: 2px solid rgba(125, 227, 126, 0.35);
    border-radius: 28px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5), inset 0 0 40px rgba(125,227,126,0.05);
    backdrop-filter: blur(6px);
    max-width: 620px;
    width: 92%;
  }

  .basket-icon {
    font-size: 56px;
    margin-bottom: 8px;
    filter: drop-shadow(0 0 12px rgba(125,227,126,0.5));
  }

  h1 {
    font-size: clamp(1.4rem, 4vw, 2.1rem);
    letter-spacing: 1px;
    color: #b7f7b8;
    text-transform: uppercase;
    margin-bottom: 6px;
  }

  .subtitle {
    color: #9ecb9e;
    font-size: 0.95rem;
    margin-bottom: 32px;
    letter-spacing: 0.5px;
  }

  .timer {
    display: flex;
    justify-content: center;
    gap: 14px;
    flex-wrap: wrap;
    margin-bottom: 28px;
  }

  .unit {
    background: linear-gradient(145deg, #14351a, #0c220f);
    border: 1px solid rgba(125,227,126,0.3);
    border-radius: 16px;
    padding: 18px 14px;
    min-width: 88px;
    box-shadow: 0 6px 16px rgba(0,0,0,0.4);
  }

  .unit .num {
    font-size: clamp(1.8rem, 6vw, 2.8rem);
    font-weight: 800;
    color: #7de37e;
    text-shadow: 0 0 18px rgba(125,227,126,0.5);
    font-variant-numeric: tabular-nums;
  }

  .unit .label {
    margin-top: 4px;
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: #9ecb9e;
  }

  .flight-line {
    width: 100%;
    height: 40px;
    position: relative;
    margin-bottom: 20px;
  }

  .disc {
    position: absolute;
    top: 50%;
    left: 0;
    transform: translateY(-50%);
    font-size: 22px;
    animation: fly 4s ease-in-out infinite;
  }

  @keyframes fly {
    0% { left: 0%; transform: translateY(-50%) rotate(0deg); }
    50% { left: 90%; transform: translateY(-70%) rotate(540deg); }
    100% { left: 0%; transform: translateY(-50%) rotate(0deg); opacity: 0; }
    1% { opacity: 1; }
  }

  .track {
    position: absolute;
    top: 50%;
    left: 0;
    right: 0;
    height: 2px;
    background: repeating-linear-gradient(90deg, rgba(125,227,126,0.25) 0 8px, transparent 8px 16px);
    transform: translateY(-50%);
  }

  .status {
    font-size: 1.05rem;
    color: #d8f5d8;
    font-weight: 600;
    letter-spacing: 0.5px;
  }

  .footer-note {
    margin-top: 22px;
    font-size: 0.78rem;
    color: #6fa072;
    letter-spacing: 0.4px;
  }

  @media (max-width: 420px) {
    .unit { min-width: 70px; padding: 14px 8px; }
  }
</style>
</head>
<body>

<div class="card">
  <div class="basket-icon">🥏</div>
  <h1>Countdown to Tee Off</h1>
  <div class="subtitle" id="dateLabel"></div>

  <div class="flight-line">
    <div class="track"></div>
    <div class="disc">🥏</div>
  </div>

  <div class="timer" id="timer">
    <div class="unit"><div class="num" id="days">--</div><div class="label">Days</div></div>
    <div class="unit"><div class="num" id="hours">--</div><div class="label">Hours</div></div>
    <div class="unit"><div class="num" id="minutes">--</div><div class="label">Mins</div></div>
    <div class="unit"><div class="num" id="seconds">--</div><div class="label">Secs</div></div>
  </div>

  <div class="status" id="status"></div>
  <div class="footer-note">Chains up, discs ready 🌳</div>
</div>

<script>
  // Set the target date here — Oct 23, at local midnight
  const targetDate = new Date("2026-10-23T00:00:00");

  document.getElementById("dateLabel").textContent =
    targetDate.toLocaleDateString(undefined, { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

  function updateCountdown() {
    const now = new Date();
    const diff = targetDate - now;

    if (diff <= 0) {
      document.getElementById("timer").style.display = "none";
      document.getElementById("status").textContent = "🎉 It's here — go throw some discs!";
      return;
    }

    const days = Math.floor(diff / (1000 * 60 * 60 * 24));
    const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
    const minutes = Math.floor((diff / (1000 * 60)) % 60);
    const seconds = Math.floor((diff / 1000) % 60);

    document.getElementById("days").textContent = String(days).padStart(2, "0");
    document.getElementById("hours").textContent = String(hours).padStart(2, "0");
    document.getElementById("minutes").textContent = String(minutes).padStart(2, "0");
    document.getElementById("seconds").textContent = String(seconds).padStart(2, "0");

    document.getElementById("status").textContent = days > 0
      ? `${days} day${days === 1 ? "" : "s"} left on the fairway`
      : "Almost tee time!";
  }

  updateCountdown();
  setInterval(updateCountdown, 1000);

  // decorative floating discs in background
  const body = document.body;
  for (let i = 0; i < 10; i++) {
    const d = document.createElement("div");
    d.className = "bg-disc";
    const size = 20 + Math.random() * 50;
    d.style.width = size + "px";
    d.style.height = size + "px";
    d.style.left = Math.random() * 100 + "vw";
    d.style.animationDuration = (12 + Math.random() * 14) + "s";
    d.style.animationDelay = (Math.random() * 10) + "s";
    body.appendChild(d);
  }
</script>

</body>
</html>
